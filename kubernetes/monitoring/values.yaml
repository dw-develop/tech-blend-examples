# Kube-Prometheus-Stack Values
# Production-ready configuration for monitoring

prometheus:
  prometheusSpec:
    # Data retention
    retention: 15d
    retentionSize: "45GB"

    # Resource allocation
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # Persistent storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Scrape interval
    scrapeInterval: 30s
    evaluationInterval: 30s

    # External labels
    externalLabels:
      cluster: "production"
      environment: "prod"

grafana:
  # Admin credentials (CHANGE IN PRODUCTION!)
  adminPassword: "prom-operator"

  # Persistence
  persistence:
    enabled: true
    size: 10Gi

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Grafana configuration
  grafana.ini:
    server:
      root_url: "https://grafana.yourdomain.com"
    security:
      admin_user: admin
    auth:
      disable_login_form: false
    users:
      auto_assign_org_role: Viewer

  # Additional dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

alertmanager:
  alertmanagerSpec:
    # Resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

  # Alert routing configuration
  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'
      routes:
      - match:
          severity: critical
        receiver: 'critical'
        continue: true
      - match:
          severity: warning
        receiver: 'warning'

    receivers:
    - name: 'default'
      # Add your notification channels here
      # email_configs:
      # - to: 'alerts@example.com'

    - name: 'critical'
      # Critical alerts can go to multiple channels
      # slack_configs:
      # - api_url: 'YOUR_SLACK_WEBHOOK'
      #   channel: '#alerts-critical'

    - name: 'warning'
      # Warning alerts
      # slack_configs:
      # - api_url: 'YOUR_SLACK_WEBHOOK'
      #   channel: '#alerts-warning'

# Node exporter - collects host metrics
prometheus-node-exporter:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Kube-state-metrics - K8s object metrics
kube-state-metrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Default rules and alerts
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
